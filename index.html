<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Termine | touhuus</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <div class="wordmark">tou<span>huus</span></div>
            <div class="tagline">
              Die Wissensplattform für den<br />Tourismus in Schleswig-Holstein
            </div>
          </div>
        </div>
        <ul class="sections">
          <li>Tourismusstrategie</li>
          <li>Projekte</li>
          <li aria-current="page">Termine</li>
          <li>Partner</li>
        </ul>
        <span class="sign-in">Anmelden</span>
      </div>
    </header>
    <main>
      <section class="intro" aria-labelledby="heading">
        <div class="intro-inner">
          <h1 id="heading">Iframe Test</h1>
          <p>DPM Einbetung test</p>
        </div>
      </section>

      <div class="dashboard-section">
        <div class="dashboard-layout">
          <!-- DPM iframe configuration -->
          <iframe
            class="dashboard-frame"
            title="DPM-Dashboard"
            src="https://dpm.ids-kiel.de/home"
            width="768"
            height="720"
          ></iframe>
          <div class="dashboard-placeholders" aria-hidden="true">
            <div class="placeholder-card">
              <span class="placeholder-heading"></span>
              <span class="placeholder-line"></span>
              <span class="placeholder-line"></span>
            </div>
            <div class="placeholder-card">
              <span class="placeholder-heading"></span>
              <span class="placeholder-line"></span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
